<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f2f2f2; font-family: 'Inter', sans-serif; cursor: crosshair; }
        .monochrome-card { background: white; border-radius: 24px; }
        .black-btn { background: black; color: white; border-radius: 12px; }
        .task-row { border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; cursor: pointer; }
        .completed-task { background: #000 !important; color: #fff !important; padding-left: 10px; padding-right: 10px; border-radius: 8px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-4xl font-black mb-2 lowercase">aura architect</h1>
        <div class="flex justify-between items-center mb-8">
            <span class="bg-black text-white px-3 py-1 text-xs font-bold rounded" id="tierBadge">TIER 0: UNTAPPED</span>
            <span id="pointsDisplay" class="font-mono font-bold">PTS: 0</span>
        </div>

        <div class="monochrome-card p-8 text-center mb-6 shadow-sm border border-black/5">
            <div class="inline-block relative">
                <div class="w-32 h-32 rounded-full border-8 border-black flex items-center justify-center text-3xl font-black" id="faceRating">--</div>
            </div>
            <p class="mt-4 text-sm text-gray-500 uppercase tracking-widest">Aesthetic Audit Score</p>
        </div>

        <div class="monochrome-card p-6 shadow-sm border border-black/5">
            <h2 class="text-xl font-bold mb-4">daily protocol</h2>
            <div id="taskList" class="space-y-1">
                <p class="text-gray-400 text-sm italic">Upload photo for brutal analysis...</p>
            </div>
            
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <button onclick="document.getElementById('imageInput').click()" class="black-btn w-full py-4 mt-6 font-bold uppercase tracking-tighter hover:opacity-90">
                Start Neural Scan
            </button>
            <button id="eodBtn" onclick="finishDay()" class="hidden w-full py-4 mt-2 border-2 border-black font-bold uppercase tracking-tighter rounded-xl">
                Finish Day (EOD Selfie)
            </button>
        </div>
    </div>

    <script>
        let points = 0;
        let tasksDone = 0;

        document.getElementById('imageInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // UI Feedback
            document.getElementById('taskList').innerHTML = "Scanning geometry... Analyzing pathology...";
            
            // In a real Vercel setup, you'd send this to an API route.
            // For now, let's trigger the "Architect" logic simulation.
            setTimeout(() => {
                renderAudit();
            }, 2000);
        };

        function renderAudit() {
            document.getElementById('faceRating').innerText = "6.2";
            document.getElementById('tierBadge').innerText = "TIER I: DISCIPLINED";
            const tasks = [
                { id: 1, text: "0.05% Tretinoin", sub: "Fix texture/dark spots" },
                { id: 2, text: "Posture Correction", sub: "Fix neck tilt" },
                { id: 3, text: "Hydration (3L)", sub: "Depuff eye area" }
            ];
            
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map(t => `
                <div class="task-row" onclick="toggleTask(this)">
                    <div><p class="font-bold">${t.text}</p><p class="text-xs text-gray-400">${t.sub}</p></div>
                    <div class="w-5 h-5 border border-black rounded"></div>
                </div>
            `).join('');
            document.getElementById('eodBtn').classList.remove('hidden');
        }

        function toggleTask(el) {
            el.classList.toggle('completed-task');
            tasksDone = document.querySelectorAll('.completed-task').length;
        }

        function finishDay() {
            if (tasksDone < 3) {
                alert("The Architect demands total completion. Finish your protocol.");
                return;
            }
            points += 100;
            document.getElementById('pointsDisplay').innerText = `PTS: ${points}`;
            alert("Day archived. 100 Points Awarded. Aura increasing.");
        }
    </script>
</body>
</html>
